author: "Ajax50"
delete-after: True
changes:
  - map: "The Gallowfort has been moved further north and been thoroughly remodeled."
  - map: "A quaint adventurer's campsite has been placed on the peninsula just below the old Gallowfort location."
  - map: "The mountain that housed the old Gallowband barracks is now the site of an ancient castle ruins. Beware the trolls!"
  - map: "Thatchwood has been given slightly more inviting trails and road signs."
  - map: "A sparse few braziers now line the Murderwoods trade road, courtesy of the Gallowband."
  - map: "The hidden Murderwoods fishing cabin and ritual site on the west side of the map have had their locations adjusted slightly to accommodate the other map changes."